name: tests

# Windows only: the macOS suite runs on the Mac before every push, and hosted macOS runners
# never got picked up for this repo (every run sat queued, then was cancelled).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Tests
        shell: bash
        run: uv run -q --no-project --with pytest --with ruamel.yaml python -m pytest tests -q -p no:cacheprovider -rfE --tb=short
