<!-- Live gallery preview: a 6 s mini-edit in CSS (contract: docs/motion-knowledge/09-styles.md §5). One shared timeline (--T)
     offset by --rest: two blocks snap into a bar → the bar rounds into a circle, rings spawn and turn in steps → two
     palette-flip cuts (black/gold, white/blue) → star bursts pop out of a blob, dither drifts → "10" plate → back to the blocks. -->
<style>
.s{--T:6s;position:absolute;inset:0;overflow:hidden;font-family:var(--display)}
.s *{box-sizing:border-box;animation-duration:var(--T);animation-iteration-count:infinite;animation-fill-mode:both;animation-delay:calc(-1 * var(--rest, 0s))}
/* the field: blue grid, flipped on the cuts */
.bg{position:absolute;inset:0;animation-name:bg;animation-timing-function:steps(1,end);
 background-image:repeating-linear-gradient(0deg,var(--g) 0 .1vw,transparent .1vw 3vw),repeating-linear-gradient(90deg,var(--g) 0 .1vw,transparent .1vw 3vw)}
@keyframes bg{0%{background-color:var(--bg);--g:color-mix(in srgb,var(--surface) 13%,transparent);color:var(--surface)}
 56%{background-color:var(--night);--g:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
 60%{background-color:var(--surface);--g:color-mix(in srgb,var(--bg) 10%,transparent);color:var(--bg)}
 80%,100%{background-color:var(--bg);--g:color-mix(in srgb,var(--surface) 13%,transparent);color:var(--surface)}}
.fg{position:absolute;inset:0;animation-name:fg;animation-timing-function:steps(1,end)}
@keyframes fg{0%{color:var(--surface)}56%{color:var(--accent)}60%{color:var(--bg)}64%,100%{color:var(--surface)}}
/* A: two blocks → a bar (and back at the end) */
.blk{position:absolute;top:50%;left:50%;background:currentColor;animation-name:b1;animation-timing-function:cubic-bezier(.76,0,.24,1)}
.blk.r{animation-name:b2}
@keyframes b1{0%,12%{width:15.6vw;height:10.4vw;transform:translate(calc(-50% - 18.8vw),-50%)}20%{width:22.4vw;height:6.3vw;transform:translate(calc(-100% - .6vw),-50%);opacity:1}
 21%,91%{opacity:0}92%{opacity:1;width:22.4vw;height:6.3vw;transform:translate(calc(-100% - .6vw),-50%)}100%{width:15.6vw;height:10.4vw;transform:translate(calc(-50% - 18.8vw),-50%)}}
@keyframes b2{0%,12%{width:15.6vw;height:10.4vw;transform:translate(calc(-50% + 18.8vw),-50%)}20%{width:22.4vw;height:6.3vw;transform:translate(.6vw,-50%);opacity:1}
 21%,91%{opacity:0}92%{opacity:1;width:22.4vw;height:6.3vw;transform:translate(.6vw,-50%)}100%{width:15.6vw;height:10.4vw;transform:translate(calc(-50% + 18.8vw),-50%)}}
/* bar → circle → small core, pixel-stepped in time */
.core{position:absolute;top:50%;left:50%;background:currentColor;transform:translate(-50%,-50%);animation-name:co;animation-timing-function:steps(6,end)}
@keyframes co{0%,19.9%{opacity:0;width:44.8vw;height:6.3vw;border-radius:0}20%{opacity:1;width:44.8vw;height:6.3vw;border-radius:0}
 32%{width:19.8vw;height:19.8vw;border-radius:50%}40%,56%{width:4.4vw;height:4.4vw;border-radius:50%;opacity:1}64%{opacity:0;width:4.4vw;height:4.4vw;border-radius:50%}100%{opacity:0}}
/* B: rings, broken arcs turning at their own speeds in steps */
.ring{position:absolute;top:50%;left:50%;border-radius:50%;border:solid currentColor;animation-timing-function:steps(10,end)}
.ring.a{width:15vw;height:15vw;margin:-7.5vw;border-width:.9vw;border-left-color:transparent;animation-name:ra}
.ring.b{width:22vw;height:22vw;margin:-11vw;border-width:.25vw;border-style:dashed;animation-name:rb}
.ring.c{width:29vw;height:29vw;margin:-14.5vw;border-width:1.4vw;border-top-color:transparent;border-right-color:transparent;animation-name:rc}
.ring.d{width:36vw;height:36vw;margin:-18vw;border-width:.18vw;border-style:dotted;animation-name:rd}
.ring.e{width:44vw;height:44vw;margin:-22vw;border-width:2vw;border-bottom-color:transparent;border-left-color:transparent;opacity:.9;animation-name:re}
@keyframes ra{0%,33%{transform:scale(.3) rotate(0);opacity:0}38%{opacity:1;transform:scale(1) rotate(40deg)}64%{opacity:1;transform:scale(1) rotate(300deg)}65%,100%{opacity:0}}
@keyframes rb{0%,35%{transform:scale(.3) rotate(0);opacity:0}40%{opacity:1;transform:scale(1) rotate(-30deg)}64%{opacity:1;transform:scale(1) rotate(-200deg)}65%,100%{opacity:0}}
@keyframes rc{0%,36%{transform:scale(.3) rotate(0);opacity:0}42%{opacity:1;transform:scale(1) rotate(60deg)}64%{opacity:1;transform:scale(1) rotate(420deg)}65%,100%{opacity:0}}
@keyframes rd{0%,38%{transform:scale(.3);opacity:0}44%,64%{opacity:1;transform:scale(1) rotate(-90deg)}65%,100%{opacity:0}}
@keyframes re{0%,39%{transform:scale(.3) rotate(0);opacity:0}46%{opacity:1;transform:scale(1) rotate(-20deg)}64%{opacity:1;transform:scale(1) rotate(-160deg)}65%,100%{opacity:0}}
/* C: the blob and star bursts */
.blob{position:absolute;top:-5%;bottom:-5%;right:0;width:46vw;background:var(--bg);border-radius:48% 0 0 40% / 30% 0 0 60%;animation-name:bl;animation-timing-function:cubic-bezier(.16,1,.3,1)}
@keyframes bl{0%,63.9%{transform:translateX(110%)}64%{transform:translateX(100%)}70%,78%{transform:translateX(0)}80%,100%{transform:translateX(110%)}}
.st{position:absolute;color:var(--surface);animation-name:sp;animation-timing-function:cubic-bezier(.34,1.6,.64,1)}
.st svg{width:100%;height:100%;display:block;overflow:visible}
.st.o{color:var(--bg)}
@keyframes sp{0%,65%{transform:scale(0) rotate(0)}70%{transform:scale(1) rotate(25deg)}78%{transform:scale(1) rotate(45deg)}80%,100%{transform:scale(0) rotate(45deg)}}
.dith{position:absolute;left:18vw;top:22vw;width:24vw;height:16vw;color:var(--bg);animation-name:di;animation-timing-function:steps(5,end)}
.dith i{position:absolute;width:.9vw;height:.9vw;background:currentColor}
@keyframes di{0%,66%{opacity:0;transform:none}68%{opacity:1;transform:none}79%{opacity:.4;transform:translateX(-9vw)}80%,100%{opacity:0}}
/* E: the number plate */
.plate{position:absolute;left:29vw;top:20vw;width:42vw;height:28vw;background:var(--surface);display:grid;place-items:center;animation-name:pl;animation-timing-function:steps(1,end)}
@keyframes pl{0%,79.9%{opacity:0}80%,91.9%{opacity:1}92%,100%{opacity:0}}
.plate svg{width:24vw;height:20vw;overflow:visible}
.plate text{font-family:var(--display);font-weight:300;font-size:200px;fill:none;stroke:var(--accent2);stroke-width:3;stroke-dasharray:900;animation:tr var(--T) cubic-bezier(.83,0,.17,1) infinite both;animation-delay:calc(-1 * var(--rest,0s))}
@keyframes tr{0%,80%{stroke-dashoffset:900}90%,100%{stroke-dashoffset:0}}
.plate small{position:absolute;bottom:1.6vw;font:400 1.2vw var(--text);color:var(--bg)}
.spk{position:absolute;width:8vw;height:8vw;margin:-4vw;color:var(--surface);animation-name:sk;animation-timing-function:cubic-bezier(.34,1.6,.64,1)}
@keyframes sk{0%,81%{transform:scale(0)}85%,90%{transform:scale(1)}92%,100%{transform:scale(0)}}
.spk svg{width:100%;height:100%;overflow:visible}
</style>

 <div class="ring e"></div><div class="ring d"></div><div class="ring c"></div><div class="ring b"></div><div class="ring a"></div>
