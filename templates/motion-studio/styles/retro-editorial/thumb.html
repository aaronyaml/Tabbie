<!-- Live gallery preview: an 8 s mini-edit (contract: docs/motion-knowledge/09-styles.md §5). One shared timeline
     (--T, offset by --rest). The wall never cuts, it re-tiles: every tile flips on its own group's step
     (scattered clusters, ~2 f apart) from the top-right into red + sand, then back to teal from the bottom-left.
     One stamp drifts → re-tile → the deck fans out, limona rises → it sinks, re-tile back, the deck gathers →
     one stamp drifts home (= 0 %). -->
