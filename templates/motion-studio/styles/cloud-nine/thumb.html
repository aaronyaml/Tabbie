<!-- Live gallery preview: a 6 s mini-edit in CSS (contract: docs/motion-knowledge/09-styles.md §5). One shared timeline (--T)
     offset by --rest, one continuous shot in a painted world: "Daydream" waves in letter by letter → squashes into a white
     block → a 3D stack of rounded cards floats, its screen swaps → focus whip left as the camera tilts into sky →
     "Make it feel easy" blurs in word by word → blurs out, camera back on the hill. -->
<style>
.s{--T:6s;position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,var(--bg) 0%,var(--sky) 45%,var(--haze) 90%);color:var(--ink)}
.s *{box-sizing:border-box;animation-duration:var(--T);animation-iteration-count:infinite;animation-fill-mode:both;animation-delay:calc(-1 * var(--rest, 0s))}
.sun{position:absolute;inset:0;background:radial-gradient(circle at 6% 4%,color-mix(in srgb,var(--surface) 75%,transparent) 0,color-mix(in srgb,var(--surface) 18%,transparent) 14%,transparent 30%)}
/* the camera tilt: hill sinks most, clouds less */
.hill,.cl,.cf{position:absolute;inset:0;animation-timing-function:cubic-bezier(.4,0,.2,1)}
.hill{animation-name:th}.cl{animation-name:tc}.cf{animation-name:tf}
@keyframes th{0%,64%{transform:none}80%,86%{transform:translateY(18vw)}100%{transform:none}}
@keyframes tc{0%,64%{transform:none}80%,86%{transform:translateY(8vw)}100%{transform:none}}
@keyframes tf{0%,64%{transform:none}80%,86%{transform:translateY(3.5vw)}100%{transform:none}}
.hill svg,.cl svg,.cf svg{position:absolute;inset:0;width:100%;height:100%}
.cloud{filter:blur(.5vw)}
.pt{position:absolute;width:.7vw;height:.32vw;border-radius:50%;background:var(--petal);opacity:.8;animation-name:pt;animation-timing-function:linear}
@keyframes pt{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(14vw,2vw) rotate(260deg)}100%{transform:translate(28vw,-1vw) rotate(520deg)}}
/* A: the wave word */
.w{position:absolute;left:0;right:0;top:19vw;text-align:center;font:800 8.6vw/1 var(--display);letter-spacing:-.04em;text-shadow:0 .6vw 2vw color-mix(in srgb,var(--night) 18%,transparent);animation-name:sq;animation-timing-function:cubic-bezier(.45,0,.2,1)}
@keyframes sq{0%,20%{transform:none;filter:none;opacity:1}30%{transform:scaleX(.22) scaleY(1.4);filter:blur(.8vw);opacity:.6}33%,100%{opacity:0;transform:scaleX(.22)}}
.w b{display:inline-block;font-weight:inherit;animation-name:wv;animation-timing-function:cubic-bezier(.22,1.3,.36,1)}
@keyframes wv{0%{opacity:0;transform:translate(-14vw,11vw) rotate(-55deg) scale(.4);filter:blur(.5vw)}12%,100%{opacity:1;transform:none;filter:none}}
.w b:nth-child(1){animation-delay:calc(.01 * var(--T) - var(--rest,0s))}.w b:nth-child(2){animation-delay:calc(.025 * var(--T) - var(--rest,0s))}
.w b:nth-child(3){animation-delay:calc(.04 * var(--T) - var(--rest,0s))}.w b:nth-child(4){animation-delay:calc(.055 * var(--T) - var(--rest,0s))}
.w b:nth-child(5){animation-delay:calc(.07 * var(--T) - var(--rest,0s))}.w b:nth-child(6){animation-delay:calc(.085 * var(--T) - var(--rest,0s))}
.w b:nth-child(7){animation-delay:calc(.1 * var(--T) - var(--rest,0s))}.w b:nth-child(8){animation-delay:calc(.115 * var(--T) - var(--rest,0s))}
/* B: the floating card stack, whipped out of focus */
.stk{position:absolute;left:50%;top:15vw;width:19vw;height:19vw;margin-left:-9.5vw;perspective:90vw;animation-name:wh;animation-timing-function:cubic-bezier(.55,0,.85,.4)}
@keyframes wh{0%,26%{opacity:0;transform:none;filter:none}29%,58%{opacity:1;transform:none;filter:none}68%{opacity:0;transform:translate(-46vw,-3vw) scale(1.45);filter:blur(1.6vw)}100%{opacity:0}}
.rig{position:absolute;inset:0;transform-style:preserve-3d;animation-name:bob;animation-timing-function:cubic-bezier(.37,0,.63,1)}
@keyframes bob{0%,28%{transform:rotateX(10deg) rotateY(-16deg)}40%{transform:rotateX(13deg) rotateY(-11deg) translateY(-.5vw)}52%{transform:rotateX(8deg) rotateY(-19deg) translateY(.3vw)}64%,100%{transform:rotateX(10deg) rotateY(-16deg)}}
.cd{position:absolute;inset:0;border-radius:2.4vw;overflow:hidden;border:.32vw solid var(--card);box-shadow:0 2vw 4vw color-mix(in srgb,var(--night) 22%,transparent);animation-timing-function:cubic-bezier(.22,1,.36,1)}
.cd.a{background:linear-gradient(180deg,var(--haze),var(--accent2));animation-name:ca}
.cd.b{background:var(--night);animation-name:cb}
.cd.c{background:var(--card);animation-name:cc}
@keyframes ca{0%,29%{opacity:0;transform:scale(.6)}38%,100%{opacity:1;transform:translate3d(-12vw,1.6vw,-4vw) rotate(-9deg)}}
@keyframes cb{0%,29%{opacity:0;transform:scale(.6)}38%,100%{opacity:1;transform:translate3d(-2vw,-2vw,-2vw) rotate(3deg)}}
@keyframes cc{0%,25%{opacity:0;transform:scale(.5)}33%,100%{opacity:1;transform:translate3d(8vw,2vw,0) rotate(8deg)}}
.cd.a i{position:absolute;left:1.8vw;bottom:3.6vw;font:800 4.6vw/1 var(--display);font-style:normal;color:var(--surface);letter-spacing:-.04em}
.cd.b i{position:absolute;left:1.6vw;right:1.6vw;top:3.6vw;bottom:4.6vw;border-radius:1vw;background:radial-gradient(circle at 40% 60%,var(--warm) 0,color-mix(in srgb,var(--warm) 40%,var(--night)) 35%,var(--night) 75%)}
.dot{position:absolute;left:50%;top:48%;width:3.4vw;height:3.4vw;margin:-1.7vw;border-radius:50%;background:var(--accent);box-shadow:0 0 0 .8vw color-mix(in srgb,var(--accent) 18%,transparent);animation-name:sw1}
.pill{position:absolute;left:2.6vw;right:2.6vw;top:36%;height:5.8vw;border-radius:1.4vw;background:var(--night);animation-name:sw2}
.pill:after{content:"";position:absolute;left:1.6vw;right:1.6vw;bottom:1.6vw;height:.42vw;border-radius:.2vw;background:var(--accent2)}
@keyframes sw1{0%,44%{opacity:1;transform:none}50%,100%{opacity:0;transform:scale(.6)}}
@keyframes sw2{0%,44%{opacity:0;transform:translateY(1.6vw)}50%,100%{opacity:1;transform:none}}
/* D: the line, word by word */
.ln{position:absolute;left:0;right:0;top:21vw;text-align:center;font:500 5vw/1 var(--text);letter-spacing:-.02em;text-shadow:0 .4vw 1.6vw color-mix(in srgb,var(--night) 16%,transparent)}
.ln b{display:inline-block;margin:0 .16em;font-weight:inherit;animation-name:bw;animation-timing-function:cubic-bezier(.22,1,.36,1)}
@keyframes bw{0%,70%{opacity:0;filter:blur(.7vw);transform:translateY(.7vw)}77%,86%{opacity:1;filter:none;transform:none}91%,100%{opacity:0;filter:blur(.8vw);transform:translateY(-1vw)}}
.ln b:nth-child(2){animation-delay:calc(.025 * var(--T) - var(--rest,0s))}.ln b:nth-child(3){animation-delay:calc(.05 * var(--T) - var(--rest,0s))}.ln b:nth-child(4){animation-delay:calc(.075 * var(--T) - var(--rest,0s))}
</style>
<div class="s" style="--rest:2.52s"><div class="sun"></div>
<div class="cf"><svg viewBox="0 0 100 56.25" preserveAspectRatio="none"><g class="cloud" style="fill:var(--surface)"><ellipse cx="90" cy="18" rx="8" ry="2.6"/><circle cx="87" cy="16.4" r="2.8"/><circle cx="91" cy="15" r="3.4"/><ellipse cx="22" cy="14" rx="6" ry="2"/><circle cx="21" cy="12.6" r="2.4"/></g></svg></div>
<div class="cl"><svg viewBox="0 0 100 56.25" preserveAspectRatio="none"><g class="cloud" style="fill:var(--surface)"><ellipse cx="78" cy="38" rx="17" ry="5"/><circle cx="72" cy="35" r="6"/><circle cx="80" cy="32" r="7.5"/><circle cx="88" cy="35.4" r="5.4"/><ellipse cx="14" cy="40" rx="14" ry="4.4"/><circle cx="10" cy="37" r="5"/><circle cx="18" cy="35" r="6"/><ellipse cx="47" cy="42" rx="12" ry="3.6"/><circle cx="45" cy="39.6" r="4.6"/></g></svg></div>
<div class="hill"><svg viewBox="0 0 100 56.25" preserveAspectRatio="none"><path d="M-5 46.8C15 42.7 36 43.7 52 45.3S88 42.7 105 44.8V62H-5Z" style="fill:var(--grass)"/><path d="M-5 51C20 48.4 42 51.6 62 50S94 48.4 105 50.5V62H-5Z" style="fill:var(--grass2);opacity:.85"/></svg></div>
<i class="pt" style="left:4vw;top:8vw"></i><i class="pt" style="left:30vw;top:14vw;animation-delay:calc(-.3 * var(--T))"></i><i class="pt" style="left:60vw;top:6vw;animation-delay:calc(-.6 * var(--T))"></i><i class="pt" style="left:12vw;top:26vw;animation-delay:calc(-.8 * var(--T))"></i>
<div class="w"><b>D</b><b>a</b><b>y</b><b>d</b><b>r</b><b>e</b><b>a</b><b>m</b></div>
<div class="stk"><div class="rig">
 <div class="cd a"><i>9:41</i></div><div class="cd b"><i></i></div><div class="cd c"><div class="dot"></div><div class="pill"></div></div>
</div></div>
