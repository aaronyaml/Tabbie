<!-- Live gallery preview: a 6 s mini-edit in CSS (contract: docs/motion-knowledge/09-styles.md §5), everything drawn
     on twos (steps). One shared timeline (--T) offset by --rest. "what do" huge over crawling dashed guides → the
     caption types word by word behind a block cursor while the vignette closes in → a cyan four-point flare sweeps
     in from the edge and whites out → eight keepsakes pop into an orbiting ring with spark bursts and ink puffs
     (rest) → a red flash frame with a white zig-zag → a silhouette heats up into a thermal map → loose letters drift,
     the red pen circles the k → "what do" pops back letter by letter. -->
